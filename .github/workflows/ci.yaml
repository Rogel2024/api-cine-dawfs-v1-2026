name: CI api cine

on:
  push:
    branches: [master]

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/api-cine:${{ github.sha }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar-dependencias
        run: npm ci

      - name: ejecución-pruebas
        run: npm run test
  
  docker:
    needs: pruebas            # solo publica si "pruebas" pasó
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-build
        run: docker build -f ./Dockerfile -t "$IMAGEN" .
      
      - name: inicio-sesion-docker
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: push-a-docker
        run: docker push "$IMAGEN"

#      - name: construir-imagen
#        run: docker build -t $IMAGEN:${{ github.sha }} -t $IMAGEN:latest .

#      - name: subir-imagen
#        run: |
#          docker push $IMAGEN:${{ github.sha }}
#          docker push $IMAGEN:latest